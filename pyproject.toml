[project]
name = "bento"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Romeyus", email = "marco.possamai@proton.me" }]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pyright]
extraPaths = ["src"]
ignore = ["**/__pycache__"]
typeCheckingMode = "strict"

[tool.pytest]
addopts = [
    "--cov=src/bento",
    "--cov-report=term-missing",
    "--import-mode=importlib",
]
pythonpath = ["src"]
strict = true
